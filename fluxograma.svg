<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Fluxograma da Caixinha do Tchauzinho MarS</title>
  <desc id="desc">O Arduino Uno inicializa sensor e servos, mede a distância e decide se deve iniciar o tchau, rearmar ao detectar afastamento ou manter o estado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#111c34"/></linearGradient>
    <linearGradient id="start" x1="0" x2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity=".55"/></filter>
    <style>
      .box{fill:#1e293b;stroke:#64748b;stroke-width:2.5}.proc{fill:#172554;stroke:#6366f1;stroke-width:2.5}.sensor{fill:#083344;stroke:#22d3ee;stroke-width:2.5}.decision{fill:#422006;stroke:#f59e0b;stroke-width:3}.action{fill:#064e3b;stroke:#34d399;stroke-width:2.5}.connector{fill:none;stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.label{font:700 19px Inter,Arial,sans-serif;fill:#f8fafc;text-anchor:middle}.sub{font:500 15px Inter,Arial,sans-serif;fill:#cbd5e1;text-anchor:middle}.branch{font:700 15px Inter,Arial,sans-serif}.small{font:600 14px Inter,Arial,sans-serif;fill:#94a3b8;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="1500" rx="28" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">MARs · CAIXINHA DO TCHAUZINHO</text>
  <text x="600" y="82" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15">Arduino Uno · Sensor ultrassônico · Dois servos</text>

  <!-- Main flow -->
  <g filter="url(#shadow)">
    <rect x="450" y="115" width="300" height="70" rx="35" fill="url(#start)" stroke="#67e8f9" stroke-width="2.5"/>
    <text class="label" x="600" y="158">LIGAR / INÍCIO</text>
    <rect class="proc" x="400" y="235" width="400" height="90" rx="18"/>
    <text class="label" x="600" y="270">Inicializar sistema</text><text class="sub" x="600" y="298">Configurar pinos e posicionar servos em 0°</text>
    <rect class="sensor" x="425" y="375" width="350" height="85" rx="18"/>
    <text class="label" x="600" y="410">Medir distância</text><text class="sub" x="600" y="438">HC-SR04 · TRIG D7 · ECHO D8</text>
    <polygon class="decision" points="600,505 790,585 600,665 410,585"/>
    <text class="label" x="600" y="578">Distância de 1–15 cm</text><text class="sub" x="600" y="605">e ainda não detectada?</text>
  </g>
  <path class="connector" d="M600 185V235"/><path class="connector" d="M600 325V375"/><path class="connector" d="M600 460V505"/>

  <!-- Yes branch to wave -->
  <text class="branch" x="815" y="570" fill="#34d399">SIM</text>
  <path class="connector" d="M790 585H930V720"/>
  <g filter="url(#shadow)">
    <rect class="action" x="770" y="720" width="320" height="100" rx="18"/>
    <text class="label" x="930" y="758">Registrar detecção</text><text class="sub" x="930" y="788">pessoaDetectada = true · base = 90°</text>
    <rect class="action" x="770" y="875" width="320" height="150" rx="18"/>
    <text class="label" x="930" y="914">Bracinho dá tchau 👋</text><text class="sub" x="930" y="946">Levanta: 0° → 90°</text><text class="sub" x="930" y="973">Oscila 2 vezes · retorna a 0°</text>
  </g>
  <path class="connector" d="M930 820V875"/>
  <path class="connector" d="M930 1025V1385H600V1430"/>

  <!-- No branch goes to reset decision -->
  <text class="branch" x="615" y="695" fill="#fbbf24">NÃO</text>
  <path class="connector" d="M600 665V720"/>
  <g filter="url(#shadow)">
    <polygon class="decision" points="600,720 790,800 600,880 410,800"/>
    <text class="label" x="600" y="793">Distância ≥ 25 cm</text><text class="sub" x="600" y="820">e pessoa já detectada?</text>
  </g>
  <text class="branch" x="810" y="785" fill="#34d399">SIM</text>
  <path class="connector" d="M790 800H930V1090"/>
  <g filter="url(#shadow)">
    <rect class="action" x="770" y="1090" width="320" height="105" rx="18"/>
    <text class="label" x="930" y="1130">Pessoa foi embora</text><text class="sub" x="930" y="1160">Libera detecção · base e braço em 0°</text>
  </g>
  <path class="connector" d="M930 1195V1385H600V1430"/>
  <text class="branch" x="615" y="912" fill="#fbbf24">NÃO</text>
  <path class="connector" d="M600 880V960"/>
  <g filter="url(#shadow)">
    <rect class="box" x="390" y="960" width="420" height="105" rx="18"/>
    <text class="label" x="600" y="1000">Manter estado atual</text><text class="sub" x="600" y="1030">16–24 cm, sem eco ou já detectada</text>
  </g>
  <path class="connector" d="M600 1065V1430"/>

  <g filter="url(#shadow)">
    <rect x="430" y="1430" width="340" height="55" rx="27" fill="url(#start)" stroke="#67e8f9" stroke-width="2.5"/>
    <text class="label" x="600" y="1465">Repetir leitura</text>
  </g>
  <path class="connector" d="M430 1457H160V417H425"/>
  <text class="small" x="173" y="900" transform="rotate(-90 173 900)">loop principal</text>
</svg>
